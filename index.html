<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="icon">🎓</div>
            <h1>Student Record Manager</h1>
            <p>Manage student information easily and securely</p>
        </header>

        <section class="card">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <input
                            type="number"
                            id="studentId"
                            placeholder="Enter student ID"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="studentName">Student Name</label>
                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input
                            type="text"
                            id="email"
                            placeholder="example@gmail.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="course">Course</label>
                        <input
                            type="text"
                            id="course"
                            placeholder="Enter course"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="age">Age</label>
                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="add-btn">
                    + Add Student
                </button>

            </form>

            <div id="message"></div>

        </section>


        <section class="card">

            <div class="section-header">

                <h2>Student Records</h2>

                <div class="actions">

                    <button
                        class="secondary-btn"
                        onclick="exportData()">
                        📥 Save to File
                    </button>

                    <label class="secondary-btn upload-btn">
                        📤 Read File
                        <input
                            type="file"
                            id="fileInput"
                            accept=".json"
                            hidden
                        >
                    </label>

                </div>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search by name, email, course or ID..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Age</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

            <div id="emptyMessage" class="empty">
                No student records available.
            </div>

        </section>


        <section class="stats">

            <div class="stat-card">
                <span>👨‍🎓</span>
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>

            <div class="stat-card">
                <span>📚</span>
                <h3 id="totalCourses">0</h3>
                <p>Courses</p>
            </div>

            <div class="stat-card">
                <span>✉️</span>
                <h3 id="totalEmails">0</h3>
                <p>Valid Emails</p>
            </div>

        </section>


        <footer>
            <p>Student Record Manager • HTML • CSS • JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
